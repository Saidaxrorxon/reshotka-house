# Nginx server block template.
#
# Copy to /etc/nginx/sites-available/reshotka-house on the server, replace
# every <PLACEHOLDER>, then:
#   sudo ln -s /etc/nginx/sites-available/reshotka-house /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Run certbot afterwards to add the HTTPS server block automatically.

server {
    listen 80;
    server_name reshetki-house.uz www.reshetki-house.uz;

    # Allow admin photo uploads larger than nginx's 1MB default
    client_max_body_size 15M;

    location /static/ {
        alias <APP_DIR>/staticfiles/;
    }

    location /media/ {
        alias <APP_DIR>/;
    }

    location / {
        proxy_pass http://unix:<APP_DIR>/gunicorn.sock:;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
